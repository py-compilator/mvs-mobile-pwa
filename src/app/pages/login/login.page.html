<ion-content [fullscreen]="true" class="login-content">
  <div class="mvs-flex-center">
    <div class="login-container">
      <div class="logo-circle">
        <span class="logo-text">M<span class="v-letter">V</span>S</span>
      </div>
      <ion-card class="mvs-login-card">
        <ion-card-header>
          <ion-card-title>Mon Voisinage en Suisse</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-segment value="neighbor" color="green-mvs">
            <ion-segment-button content-id="neighbor" value="neighbor" (click)="setLoginWorkflow(LoginWorkflow.Neighbor)">
              <ion-label class="mvs-bold-label">Voisin</ion-label>
            </ion-segment-button>
            <ion-segment-button content-id="pro" value="pro" (click)="setLoginWorkflow(LoginWorkflow.Pro)">
              <ion-label class="mvs-bold-label">Professionel</ion-label>
            </ion-segment-button>
          </ion-segment>

          <ion-segment-view>
            <!-- Neighbor User -->
            <ion-segment-content id="neighbor">
              <app-neighbor-login></app-neighbor-login>
            </ion-segment-content>

            <!-- Professional User -->
            <ion-segment-content id="pro">
              <app-pro-login></app-pro-login>
            </ion-segment-content>
          </ion-segment-view>

          <div class="divider">ou</div>

          <!-- Front-End registration Workflows Ion-Modal Controller. -->
          <app-user-registration-modal-controller [loginWorkflow]="currentLoginWorkflow()"></app-user-registration-modal-controller>

        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
