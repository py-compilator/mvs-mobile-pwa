<ion-menu side="end" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-item routerLink="/neighbor-home/mvs-events">
        <ion-icon slot="start" name="radio"></ion-icon>
        <ion-label>Événements</ion-label>
      </ion-item>
      <ion-item routerLink="/neighbor-home/mvs-map">
        <ion-icon slot="start" name="navigate"></ion-icon>
        <ion-label>Navigation</ion-label>
      </ion-item>
      <ion-item routerLink="/neighbor-home/neighbor-settings">
        <ion-icon slot="start" name="settings"></ion-icon>
        <ion-label>Réglages</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
  <ion-footer class="ion-no-border">
    <ion-toolbar>
      <ion-button expand="block" fill="clear" class="logout-button" (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Déconnexion
      </ion-button>
    </ion-toolbar>
  </ion-footer>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="mvs-events">
        <ion-icon name="radio"></ion-icon>
        <ion-label>Événements</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="mvs-map">
        <ion-icon name="navigate"></ion-icon>
        <ion-label>Navigation</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="neighbor-settings">
        <ion-icon name="settings"></ion-icon>
        <ion-label>Réglages</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</div>
